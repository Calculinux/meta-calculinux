# https://github.com/siemens/kas/blob/master/docs/userguide.rst
header:
  version: 18

distro: calculinux-distro

# wrynose checkout (split Poky: bitbake + openembedded-core + meta-yocto)
# bitbake must be sibling to openembedded-core (oe-init-build-env looks for ../bitbake)
# Pins are Yocto 6.0.2 release artefacts + companion wrynose layer commits.
repos:
  bitbake:
    url: https://git.openembedded.org/bitbake
    tag: yocto-6.0.2
    layers:
      .: disabled
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    tag: yocto-6.0.2
    patches:
      0001-compress-doc.patch:
        repo: meta-calculinux
        path: patches/compress_doc.patch
    layers:
      meta:
  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    tag: yocto-6.0.2
    layers:
      meta-poky:
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    commit: 14282a02be9c74a1276a7cda7d6c89e054699a11
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:
      meta-multimedia:
  meta-retro:
    url: https://github.com/dev-0x7C6/meta-retro.git
    commit: 4d8736a2037fcc901d1a79a45c0e61538554245e
    layers:
      .:
    patches:
      0001-meta-retro-wrynose-compat.patch:
        repo: meta-calculinux
        path: patches/meta-retro-wrynose-compat.patch
  meta-wayland:
    url: https://codeberg.org/flk/meta-wayland.git
    commit: 4e47cb0a14ec168a814e95ef2cfa2fc8618fc689
    layers:
      .:
    patches:
      0001-meta-wayland-wrynose-compat.patch:
        repo: meta-calculinux
        path: patches/meta-wayland-wrynose-compat.patch
  meta-calculinux:
    layers:
      meta-calculinux-distro:

local_conf_header:
  standard: |
    PATCHRESOLVE = "noop"
    PACKAGE_CLASSES = "package_ipk"
    RM_OLD_IMAGE = "1"
    INHERIT += "rm_work"
  meta-retro-fixes: |
    # Skip problematic recipes from meta-retro that use AUTOREV or have missing dependencies
    BBMASK += "meta-retro/recipes-extended/slipr"
    BBMASK += "meta-retro/recipes-graphics/mesa"
  diskmon: |
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
