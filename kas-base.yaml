  meta-retro:
    url: https://github.com/dev-0x7C6/meta-retro.git
    commit: 4d8736a2037fcc901d1a79a45c0e61538554245e
    layers:
      .:
    patches:
      0001-meta-retro-walnascar-compat.patch:
        repo: meta-calculinux
        path: patches/meta-retro-walnascar-compat.patch
  meta-wayland:
    url: https://codeberg.org/flk/meta-wayland.git
    commit: 4e47cb0a14ec168a814e95ef2cfa2fc8618fc689
    layers:
      .:
  meta-calculinux:
    layers:
      meta-calculinux-distro:

local_conf_header:
  standard: |
    PATCHRESOLVE = "noop"
    PACKAGE_CLASSES = "package_ipk"
    RM_OLD_IMAGE = "1"
    INHERIT += "rm_work"
    KERNEL_CLASSES += "kernel-fitimage"
  meta-retro-fixes: |
    # Skip problematic recipes from meta-retro that use AUTOREV or have missing dependencies
    BBMASK += "meta-retro/recipes-extended/slipr"
    BBMASK += "meta-retro/recipes-graphics/mesa"
  fetch-user-agent: |
    # crates.io answers 403 to wget's default User-Agent, so every crate://
    # fetch falls back to the Yocto source mirror; crates absent from that
    # mirror fail the build outright. Their crawler policy asks for a
    # descriptive agent, so send one.
    # NB: must set the whole value. bb/fetch2/wget.py supplies its default via
    # `d.getVar("FETCHCMD_wget") or "..."`, so any :append makes the variable
    # set and silently drops the wget binary from the command.
    FETCHCMD_wget = "/usr/bin/env wget --tries=2 --timeout=100 --user-agent='calculinux-yocto-build (+https://calculinux.org)'"
  fetch-git-safe-directory: |
    # kas-container runs git as root against a host-owned DL_DIR. Bitbake's
    # fetcher uses a throwaway HOME, so user gitconfig never applies, and this
    # walnascar FETCHCMD_git default has no safe.directory. Must set the whole
    # value; :append would drop the default -c flags (same as FETCHCMD_wget).
    FETCHCMD_git = "git -c gc.autoDetach=false -c core.pager=cat -c safe.bareRepository=all -c clone.defaultRemoteName=origin -c safe.directory='*'"
  rust-version: |
    # Use meta-lts-mixins' Scarthgap Rust mixin toolchain
    PREFERRED_VERSION_rust = "1.92%"
    PREFERRED_VERSION_rust-native = "1.92%"
    PREFERRED_VERSION_cargo = "1.92%"
    PREFERRED_VERSION_cargo-native = "1.92%"
    PREFERRED_VERSION_libstd-rs = "1.92%"
  diskmon: |
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
