  poky:
    url: https://git.yoctoproject.org/poky.git
    commit: db04028d9070f05c3b5dee728473fb234bd24f05
    patches:
      0001-compress-doc.patch:
        repo: meta-calculinux
        path: patches/compress_doc.patch
    layers:
      meta:
      meta-poky:
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded.git
    commit: dca497d728792e3cb655c78455c2d649af312ce8
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:
      meta-multimedia:
  meta-lts-mixins:
    url: https://git.yoctoproject.org/meta-lts-mixins
    commit: c19b6da5a3afd3c892b3b1b44983e993ac6d5308
    patches:
      0001-meta-lts-mixins-walnascar-compat.patch:
        repo: meta-calculinux
        path: patches/meta-lts-mixins-walnascar-compat.patch
      0002-meta-lts-mixins-cargo-unpackdir.patch:
        repo: meta-calculinux
        path: patches/meta-lts-mixins-cargo-unpackdir.patch
      0003-meta-lts-mixins-librsvg-native-pkgconfig.patch:
        repo: meta-calculinux
        path: patches/meta-lts-mixins-librsvg-native-pkgconfig.patch
    layers:
