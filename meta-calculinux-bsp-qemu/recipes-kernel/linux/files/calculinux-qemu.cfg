# U-Boot env on the virt board's CFI pflash, for fw_printenv/fw_setenv (RAUC)
CONFIG_MTD=y
CONFIG_MTD_CFI=y
CONFIG_MTD_CFI_INTELEXT=y
CONFIG_MTD_PHYSMAP=y
CONFIG_MTD_PHYSMAP_OF=y

# overlayfs-etc (/etc, /home, /var, ... over /data) uses overlay.ko from
# the overlayfs-calculinux recipe, which adds the upper-layer ioctls
# calculinux-update needs. The in-tree overlayfs must be off so that module
# is the only one.
# CONFIG_OVERLAY_FS is not set

# RAUC verity bundles
CONFIG_BLK_DEV_LOOP=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y

# 320x320 framebuffer console on virtio-gpu
CONFIG_DRM=y
CONFIG_DRM_VIRTIO_GPU=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y
