# Calculinux overrides on top of qemu_arm_defconfig.

# RAUC / FIT boot.scr needs these
CONFIG_CMD_SETEXPR=y
CONFIG_CMD_SETEXPR_FMT=y
CONFIG_CMD_PART=y
CONFIG_PARTITION_UUIDS=y
CONFIG_EFI_PARTITION=y

# load /data/fit/zboot_merged_*.img from OVERLAY_DATA and /boot from ROOT_x
CONFIG_FS_EXT4=y
CONFIG_CMD_EXT4=y
CONFIG_CMD_FS_GENERIC=y

CONFIG_BOOTDELAY=2

# Boot the RAUC slot's own /boot/boot.scr by PARTLABEL, as on luckfox-lyra
# (there on mmc); "bootflow scan -lb" stays as the fallback.
# CONFIG_BOOTSTD_BOOTCOMMAND is not set
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="virtio scan; setenv devtype virtio; setenv devnum 0; env exists BOOT_ORDER || setenv BOOT_ORDER A; for slot in ${BOOT_ORDER}; do if part number virtio ${devnum} ROOT_${slot} root_part_hex; then setexpr distro_bootpart fmt %d ${root_part_hex}; if load virtio ${devnum}:${distro_bootpart} ${scriptaddr} /boot/boot.scr; then source ${scriptaddr}; fi; fi; done; bootflow scan -lb"
