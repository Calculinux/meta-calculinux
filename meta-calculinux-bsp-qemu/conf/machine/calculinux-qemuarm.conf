#@TYPE: Machine
#@NAME: calculinux-qemuarm
#@DESCRIPTION: Calculinux on the QEMU Arm 'virt' board, booted through U-Boot like the Luckfox Lyra

# Same tune as luckfox-lyra, so target packages (and the opkg feed) are
# shared between the emulator and the device.
require conf/machine/include/arm/armv7a/tune-cortexa7.inc
require conf/machine/include/qemu.inc
DEFAULTTUNE = "cortexa7thf-neon-vfpv4"

# Reuse the linux-yocto qemuarm BSP (and other qemuarm overrides).
MACHINEOVERRIDES =. "qemuarm:"
KMACHINE = "qemuarma15"
KERNEL_IMAGETYPE = "zImage"

MACHINE_FEATURES = "alsa keyboard screen usbhost vfat ext2"
SERIAL_CONSOLES = "115200;ttyAMA0"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
UBOOT_MACHINE = "qemu_arm_defconfig"
EXTRA_IMAGEDEPENDS += "virtual/bootloader"

WKS_FILE = "calculinux-qemuarm.wks"
WIC_CREATE_EXTRA_ARGS ?= "--no-fstab-update"
# wic for runqemu; wic.qcow2c (compressed qcow2, which QEMU reads directly)
# is the disk the calculinux-emulator AppImage downloads on first launch.
IMAGE_FSTYPES:append = " wic wic.qcow2c"
CONVERSIONTYPES:append = " qcow2c"
CONVERSION_CMD:qcow2c = "qemu-img convert -c -O qcow2 ${IMAGE_NAME}.${type} ${IMAGE_NAME}.${type}.qcow2c"
CONVERSION_DEPENDS_qcow2c = "qemu-system-native"

# overlayfs is a module built from Calculinux/overlayfs (linux-yocto has
# CONFIG_OVERLAY_FS=n); preinit needs it to mount /etc, /usr, ... over /data.
OVERLAYFS_CALCULINUX_BRANCH = "linux-6.12"
MACHINE_EXTRA_RDEPENDS += "overlayfs-calculinux"

RAUC_SLOT_A_DEVICE = "/dev/disk/by-partlabel/ROOT_A"
RAUC_SLOT_B_DEVICE = "/dev/disk/by-partlabel/ROOT_B"
# Distinct from luckfox-lyra so device bundles never install here (and vice versa).
RAUC_COMPATIBLE = "calculinux-qemuarm"

OVERLAYFS_ETC_DEVICE = "OVERLAY_DATA"
OVERLAYFS_ETC_USE_ORIG_INIT_NAME = "0"
OVERLAYFS_ETC_MOUNT_POINT = "/data"
OVERLAYFS_ETC_FSTYPE ?= "ext4"
OVERLAYFS_ETC_EXPOSE_LOWER = "1"
OVERLAYFS_ETC_MOUNT_OPTIONS = "defaults,user_xattr"

# default-merged-fit / merge-dt-overlays-boot. U-Boot qemu_arm keeps
# fdt_high=0xffffffff, so the FDT stays where the FIT puts it: keep it clear
# of the decompressed kernel (0x40008000+) and of the FIT itself, which the
# boot script loads at ramdisk_addr_r (0x44000000).
CALCULINUX_FIT_KERNEL_LOADADDR = "0x42000000"
CALCULINUX_FIT_FDT_LOADADDR = "0x43e00000"
# No board overlays yet; users can still add their own .dtbo files.
CALCULINUX_DT_OVERLAYS = ""

# calculinux-bootscript
CALCULINUX_BOOT_CONSOLE = "ttyAMA0"
CALCULINUX_BOOT_BAUDRATE = "115200"
# Pin the 320x320 mode. QEMU reports the window size as virtio-gpu's preferred
# mode whenever the window is resized; the fbdev framebuffer is 320x320, so
# without this no mode fits and the kernel turns the output off ("Display
# output is not active."). With it, QEMU scales the 320x320 picture instead.
CALCULINUX_BOOT_EXTRA_ARGS = "video=Virtual-1:320x320"

# Emulated board. The base DTB in the FIT is dumped from QEMU with these
# same settings (see linux-yocto bbappend), so keep them in one place.
# RK3506: three Cortex-A7 cores; Luckfox Lyra: 128 MiB RAM.
CALCULINUX_QEMU_MACHINE = "virt,highmem=off"
CALCULINUX_QEMU_CPU = "cortex-a7"
CALCULINUX_QEMU_SMP = "3"
CALCULINUX_QEMU_MEM = "128"

# runqemu: boot U-Boot from pflash, which runs /boot/boot.scr from the disk.
QB_SYSTEM_NAME = "qemu-system-arm"
QB_MACHINE = "-machine ${CALCULINUX_QEMU_MACHINE}"
QB_CPU = "-cpu ${CALCULINUX_QEMU_CPU}"
QB_SMP = "-smp ${CALCULINUX_QEMU_SMP}"
QB_MEM = "-m ${CALCULINUX_QEMU_MEM}"
QB_DEFAULT_BIOS = "u-boot.bin"
QB_DEFAULT_KERNEL = "none"
QB_DEFAULT_FSTYPE = "wic"
QB_DRIVE_TYPE = "/dev/vd"
# The PicoCalc panel is 320x320.
QB_GRAPHICS = "-device virtio-gpu-pci,xres=320,yres=320"
QB_OPT_APPEND = "-device qemu-xhci -device usb-kbd"
QB_TAP_OPT = "-netdev tap,id=net0,ifname=@TAP@,script=no,downscript=no"
QB_NETWORK_DEVICE = "-device virtio-net-device,netdev=net0,mac=@MAC@"
QB_SERIAL_OPT = "-device virtio-serial-device -chardev null,id=virtcon -device virtconsole,chardev=virtcon"
QB_TCPSERIAL_OPT = "-device virtio-serial-device -chardev socket,id=virtcon,port=@PORT@,host=127.0.0.1,nodelay=on -device virtconsole,chardev=virtcon"
