# Calculinux PicoCalc / Luckfox Lyra overrides on top of Armbian's
# luckfox-lyra-rk3506_defconfig (armbian/build#10470).

# Prefer the base Lyra DT (RK3506G), not Lyra Plus
CONFIG_DEFAULT_DEVICE_TREE="rk3506-luckfox-lyra"
CONFIG_DEFAULT_FDT_FILE="rockchip/rk3506-luckfox-lyra.dtb"

# RAUC / FIT boot.scr needs these (disabled in Armbian defconfig)
CONFIG_CMD_SETEXPR=y
CONFIG_CMD_SETEXPR_FMT=y
CONFIG_CMD_PART=y
CONFIG_CMD_SOURCE=y
CONFIG_PARTITION_UUIDS=y
CONFIG_EFI_PARTITION=y

# Env in the GPT ubootenv partition (starts at 16 MiB on the WIC image)
CONFIG_ENV_IS_IN_MMC=y
CONFIG_ENV_REDUNDANT=y
CONFIG_ENV_SIZE=0x8000
CONFIG_ENV_OFFSET=0x1000000
CONFIG_ENV_OFFSET_REDUND=0x1008000

CONFIG_BOOTDELAY=5

# Host tool needs gnutls PKCS#11 we don't ship; not used on this board
# CONFIG_TOOLS_MKEFICAPSULE is not set

# PicoCalc ILI9488 SPI LCD splash + vidconsole
CONFIG_DM_SPI=y
CONFIG_ROCKCHIP_SPI=y
CONFIG_DM_I2C=y
CONFIG_SYS_I2C_ROCKCHIP=y
CONFIG_DM_VIDEO=y
CONFIG_VIDEO=y
CONFIG_VIDEO_BPP16=y
CONFIG_CONSOLE_NORMAL=y
CONFIG_VIDEO_ILI9488_SPI=y
CONFIG_CMD_BMP=y
CONFIG_BMP=y
# CONFIG_VIDEO_LOGO is not set
CONFIG_SYS_WHITE_ON_BLACK=y
CONFIG_CONSOLE_MUX=y
CONFIG_SYS_CONSOLE_IS_IN_ENV=y
