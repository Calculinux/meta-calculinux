# Built-in fbcon font for boot messages and CONSOLE=kernel.
# Terminus 6x12 (lib-fonts-add-terminus-6x12.patch) matches the cruft
# userspace default font. It is the only built-in font: fbcon autoselect
# favours <=8px fonts on panels under 400 lines, so MINI4x6 or 6x8 would
# win if enabled, and VGA 8x16 (left on by the defconfig's FONT_AUTOSELECT)
# ties and wins by array order. Full Unicode is userspace via cruft.
CONFIG_FONT_SUPPORT=y
CONFIG_FONTS=y
# CONFIG_FONT_8x8 is not set
# CONFIG_FONT_8x16 is not set
# CONFIG_FONT_MINI_4x6 is not set
# CONFIG_FONT_6x8 is not set
CONFIG_FONT_TER6x12=y
