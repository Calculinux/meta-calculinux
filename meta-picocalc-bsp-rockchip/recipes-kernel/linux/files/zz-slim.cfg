# OOTB memory slim-down for PicoCalc / Luckfox Lyra (~100MB RAM).
# Named zz-* so it wins over other fragments (merge_config last-wins).
#
# CMA size is DT, not Kconfig: base board DTS disables &cma; the DSI
# panel overlay (dsi-adapter) re-enables it and sets size when present.

# --- Protocols unused on stock PicoCalc (disable) ---
# CONFIG_BRIDGE is not set
# CONFIG_PPP is not set
# CONFIG_PPP_BSDCOMP is not set
# CONFIG_PPP_DEFLATE is not set
# CONFIG_PPP_FILTER is not set
# CONFIG_PPP_MPPE is not set
# CONFIG_PPPOE is not set
# CONFIG_PPPOL2TP is not set
# CONFIG_PPP_ASYNC is not set
# CONFIG_PPP_SYNC_TTY is not set

# CAN core as module for rare overlays; no CANFD on this product
CONFIG_CAN=m
CONFIG_CAN_RAW=m
CONFIG_CAN_BCM=m
CONFIG_CAN_GW=m
CONFIG_CAN_DEV=m
CONFIG_CAN_NETLINK=m
# CONFIG_CANFD_ROCKCHIP is not set
# CONFIG_CANFD_RK3576 is not set

# Bluetooth only when a dongle/module is present
CONFIG_BT=m
CONFIG_BT_BREDR=y
CONFIG_BT_RFCOMM=m
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=m
CONFIG_BT_LE=y
# CONFIG_BT_DEBUGFS is not set
CONFIG_BT_HCIBTUSB=m

# --- Filesystems ---
CONFIG_BTRFS_FS=m
# CONFIG_FS_ENCRYPTION is not set
# CONFIG_EXT4_FS_ENCRYPTION is not set
# CONFIG_FSCACHE is not set
# CONFIG_CACHEFILES is not set
# CONFIG_NETFS_SUPPORT is not set

# RAUC uses loop + dm-verity, not NBD (was enabling 16 nbd threads)
# CONFIG_BLK_DEV_NBD is not set

# --- Networking niceties we do not need ---
# CONFIG_CFG80211_WEXT is not set
# CONFIG_WEXT_CORE is not set
# CONFIG_WEXT_PROC is not set
# CONFIG_WEXT_PRIV is not set
# CONFIG_DUMMY is not set
# CONFIG_IPVLAN is not set

# --- MM ---
# CONFIG_KSM is not set

# DRM_FBDEV_OVERALLOC: percent of *required* fb size (default 100 = no
# extra). Do NOT set 0 — that allocates a 0-byte fb and breaks ili9488
# fbdev emulation (ret=-22, no /dev/fb0).

# --- Fonts: keep 6x8 + mini for fbcon; drop 8x8 ---
# CONFIG_FONT_8x8 is not set
CONFIG_FONT_6x8=y
CONFIG_FONT_MINI_4x6=y

# --- V4L: unlikely on stock; modules for USB / future CSI ---
CONFIG_MEDIA_SUPPORT=m
CONFIG_MEDIA_SUPPORT_FILTER=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_MEDIA_PLATFORM_SUPPORT=y
CONFIG_VIDEO_DEV=m
CONFIG_V4L_PLATFORM_DRIVERS=y
CONFIG_USB_VIDEO_CLASS=m

# --- Audio: keep Rockchip SAI / simple-card for upcoming bitbang I2S;
#     drop unused external SoC demo codecs ---
# CONFIG_SND_SOC_ES7202 is not set
# CONFIG_SND_SOC_ES8323 is not set
# CONFIG_SND_SOC_ES8328 is not set
# CONFIG_SND_SOC_ES8328_I2C is not set
# CONFIG_SND_SOC_ROCKCHIP_SPDIF is not set
# CONFIG_SND_SOC_ROCKCHIP_SPDIFRX is not set
# CONFIG_SND_SOC_ROCKCHIP_PDM_V2 is not set
# CONFIG_SND_SOC_ROCKCHIP_MULTICODECS is not set
# CONFIG_SND_SOC_RK730 is not set
# CONFIG_SND_SOC_RK_DSM is not set
CONFIG_SND_SOC_ROCKCHIP_SAI=y
CONFIG_SND_SOC_RK3506=y
CONFIG_SND_SOC_DUMMY_CODEC=y
CONFIG_SND_SIMPLE_CARD=y

# RGA debugger noise (RGA itself stays for possible DSI overlay use)
# CONFIG_ROCKCHIP_RGA_DEBUG_FS is not set
# CONFIG_ROCKCHIP_RGA_DEBUGGER is not set

# --- USB mass-storage: generic only; drop obsolete vendor quirks ---
# CONFIG_USB_STORAGE_REALTEK is not set
# CONFIG_USB_STORAGE_DATAFAB is not set
# CONFIG_USB_STORAGE_FREECOM is not set
# CONFIG_USB_STORAGE_ISD200 is not set
# CONFIG_USB_STORAGE_USBAT is not set
# CONFIG_USB_STORAGE_SDDR09 is not set
# CONFIG_USB_STORAGE_SDDR55 is not set
# CONFIG_USB_STORAGE_JUMPSHOT is not set
# CONFIG_USB_STORAGE_ALAUDA is not set
# CONFIG_USB_STORAGE_ONETOUCH is not set
# CONFIG_USB_STORAGE_KARMA is not set
# CONFIG_USB_STORAGE_CYPRESS_ATACB is not set
# CONFIG_USB_STORAGE_ENE_UB6250 is not set
