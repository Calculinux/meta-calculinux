#@TYPE: Machine
#@NAME: luckfox-lyra
#@DESCRIPTION: Configuration for luckfox-lyra based on

include conf/machine/rockchip-rk3506-evb.conf

DEFAULTTUNE = "cortexa7thf-neon-vfpv4"
MACHINEOVERRIDES .= ":rockchip-rk3506-evb"

WKS_FILE = "luckfox-lyra.wks.in"

# /etc/fstab is managed in meta-calculinux-distro (PARTLABEL=SWAP, etc.).
# Without this, wic appends generic /dev/sdaN swap entries during image
# creation, causing ~90s boot delays when those devices do not exist.
WIC_CREATE_EXTRA_ARGS ?= "--no-fstab-update"

RAUC_SLOT_A_DEVICE = "/dev/disk/by-partlabel/ROOT_A"
RAUC_SLOT_B_DEVICE = "/dev/disk/by-partlabel/ROOT_B"
RAUC_COMPATIBLE = "calculinux-luckfox-lyra"

KERNEL_DEVICETREE = "rk3506g-luckfox-lyra.dtb"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
PREFERRED_VERSION_u-boot = "2026.07%"
UBOOT_MACHINE = "luckfox-lyra-rk3506_defconfig"

#Choose which partition label to use for Overlay FS
OVERLAYFS_ETC_DEVICE = "OVERLAY_DATA"

OVERLAYFS_ETC_USE_ORIG_INIT_NAME = "0"
OVERLAYFS_ETC_MOUNT_POINT = "/data"
OVERLAYFS_ETC_FSTYPE ?= "ext4"
OVERLAYFS_ETC_EXPOSE_LOWER = "1"
# Mount overlay data partition with user_xattr so extended attributes are available
OVERLAYFS_ETC_MOUNT_OPTIONS = "defaults,user_xattr"

# ext_attr enables extended attributes on the read-only root images; ^has_journal for flash wear
export RK_ROOTFS_EXTRAOPTS = "-F -i 8192 -b 4096 -E stride=256,stripe-width=256 -O ext_attr,^has_journal"
