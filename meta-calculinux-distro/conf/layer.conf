# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Appends for recipes in optional layers, used only when that layer is in
# the build (the Lyra has meta-rtlwifi; the emulator does not).
BBFILES_DYNAMIC += " \
    rtlwifi:${LAYERDIR}/dynamic-layers/rtlwifi/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "calculinux-distro"
BBFILE_PATTERN_calculinux-distro = "^${LAYERDIR}/"
BBFILE_PRIORITY_calculinux-distro = "99"

# OpenEmbedded compatibility information
# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_calculinux-distro = "1"

LAYERSERIES_COMPAT_calculinux-distro = "scarthgap walnascar wrynose"

CALCULINUX_DISTRO_LAYER_DIR = "${LAYERDIR}"
