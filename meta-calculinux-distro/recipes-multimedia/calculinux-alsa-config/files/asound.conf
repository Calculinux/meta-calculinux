# ALSA configuration for the PicoCalc M0 audio output.
#
# The M0 DAC (card 0, picocalc_snd_m0) is a single fixed output:
# 48 kHz, S16_LE, stereo, no mixer controls, no capture. The image runs
# no sound server, so the conveniences a desktop gets from one live
# here instead:
#
#   m0         plug over the hardware PCM: converts whatever rate,
#              format and channel count an application asks for to the
#              one fixed configuration the M0 takes.
#   m0-master  softvol over m0: the software master volume, the only
#              volume control this output has (amixer set "M0 Master" 80).
#   !default   the m0-master chain, i.e. conversion + volume for every
#              application that opens the default device.
#
# This file is meant to be edited. If a second sound card is added
# (e.g. USB), decide what "default" should mean and repoint the "hw:0"
# slave accordingly.

pcm.m0 {
	type plug
	slave {
		pcm "hw:0"
		rate 48000
		channels 2
		format S16_LE
	}
}

pcm.m0-master {
	type softvol
	slave.pcm "m0"
	pcm_name "M0 Master"
	control {
		name "M0 Master"
	}
}

pcm.!default {
	type refer
	name "m0-master"
}

ctl.!default {
	type card
	card 0
}
