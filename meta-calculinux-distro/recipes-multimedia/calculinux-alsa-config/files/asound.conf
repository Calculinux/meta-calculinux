# ALSA configuration for the PicoCalc M0 audio output.
#
# The M0 DAC (card 0, picocalc_snd_m0) is a single fixed output:
# 48 kHz, S16_LE, stereo, no mixer controls, no capture. The image runs
# no sound server, so the conveniences a desktop gets from one live
# here instead:
#
#   m0         plug over the hardware PCM: converts whatever rate,
#              format and channel count an application asks for to the
#              one fixed configuration the M0 takes.
#   m0-master  softvol over m0: the software master volume, the only
#              volume control this output has (amixer set "M0 Master" 80).
#   !default   a plug over the m0-master chain, i.e. conversion +
#              volume for every application that opens the default device.
#
# There is deliberately no ctl.!default here: the stock alsa.conf
# already resolves the control device, and pointing it at "type card"
# would hard-depend on the ctl_card module. The "M0 Master" control is
# registered on card 0 whenever a PCM instance of this chain is open,
# so amixer shows it while audio plays.
#
# This file is meant to be edited. If a second sound card is added
# (e.g. USB), decide what "default" should mean and repoint the "hw:0"
# slave accordingly.
#
# Syntax note: the constructs here are limited to what alsa-lib 1.2.13
# (the oldest supported image) accepts: no "type refer", no softvol
# "pcm_name" field. The softvol module ships inside the alsa-lib
# package of the image it targets.

pcm.m0 {
	type plug
	slave {
		pcm "hw:0"
		rate 48000
		channels 2
		format S16_LE
	}
}

pcm.m0-master {
	type softvol
	slave.pcm "m0"
	control {
		name "M0 Master"
	}
}

pcm.!default {
	type plug
	slave.pcm "m0-master"
}
