# /etc/cruft.conf - persistent defaults for the cruft console.
#
# KEY=VALUE lines, '#' comments; the last valid line per key wins.
# Precedence: process environment > this file > built-in defaults.
# A bad line is warned about and skipped - it never takes the console
# down. After changing: log out/in on each VT (a logout ends agetty;
# systemd restarts that VT's cruft). `console-mode apply` only re-wires
# /etc/default/console; it does not read this file.
#
# Font for the main screen (path to a .cruftfont blob):
#   /usr/share/cruft/console.cruftfont   6x12 (built-in default) ~53x26
#   /usr/share/cruft/miniwi.cruftfont    4x8                    ~80x40
#   /usr/share/cruft/unifont.cruftfont   8x16, full BMP         ~40x20
#CRUFT_FONT=/usr/share/cruft/console.cruftfont

# Status bar in the top margin strip (on by default when the 4x8
# status font is installed):
#   CRUFT_SB - comma-joined segment names (blanks squeeze to commas):
#     time  wifi  battery  title  all  none (or 0)
#     a segment whose data source is absent (VM, no battery, ...)
#     is hidden
#   CRUFT_SB_FONT - .cruftfont blob for the bar (4x8 class)
#   CRUFT_SB_12H - 1 for a 12-hour clock (default 24-hour)
#CRUFT_SB=all
#CRUFT_SB_FONT=/usr/share/cruft/status.cruftfont
#CRUFT_SB_12H=0

# Scrollback history: TOTAL depth in rows, RAM + disk (built-in
# default 96, cap 16384; 0 disables history and the scrollbar). Rows
# older than the RAM tier spill to a session file in /var/tmp
# (removed on exit); see cruft(1).
#CRUFT_HISTORY=16384
# Rows of that depth kept in the RAM tier (built-in default 512):
# only depths above this value use the disk tier.
#CRUFT_SB_RAM=512
