# One time-boxed build pass on a GitHub-hosted runner.
#
# Called several times in a chain by build-hosted.yml, once per lane:
#   image  the image, bundle and packages
#   sdk    both SDKs, after the image lane (published refs only)
#
# Each pass:
#   1. restores the shared image sstate cache (the SDK lane also its own SDK
#      cache on top), plus the sstate deltas earlier passes of this lane left
#      in this run; sources come lazily from the .sources mirror on the opkg
#      server;
#   2. runs its lane until it finishes or the pass deadline arrives;
#   3. if unfinished, uploads only the sstate it created as an artifact for
#      the next pass (so PRs never write to the Actions cache);
#   4. if finished, uploads the build outputs, and on main saves the cache:
#      the image lane its pruned working set (two newest kept), the SDK lane
#      only the objects the image entry lacks (newest kept).
name: Yocto build pass

on:
  workflow_call:
    inputs:
      pass:
        type: number
        required: true
      lane:
        description: image or sdk
        type: string
        default: image
      kas_file:
        type: string
        default: kas-luckfox-lyra-bundle.yaml
      machine:
        type: string
        default: luckfox-lyra
    outputs:
      done:
        value: ${{ jobs.pass.outputs.done }}

env:
  SSTATE_DIR: /home/runner/yocto-cache/sstate-cache
  # The SDK entry is saved and restored at this fixed path (the cache key
  # covers the path) and hardlinked in and out of SSTATE_DIR.
  SDK_SSTATE_DIR: /home/runner/yocto-cache/sdk-sstate
  DL_DIR: /mnt/yocto-downloads
  # Minutes of the 6h job reserved for bitbake; the rest covers setup,
  # cache restore, SIGINT wind-down and the delta upload.
  BUILD_BUDGET_MIN: 285
  # The repo's Actions cache limit is 50 GB: two image entries plus one SDK
  # entry, plus one more briefly while an entry is replaced.
  SSTATE_CACHE_BUDGET_MIB: 15000
  SDK_CACHE_BUDGET_MIB: 8000
  # Only pushes to main write the shared caches; PR passes hand sstate along
  # as run artifacts, so they never evict them.
  SAVE_CACHE: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
  LC_ALL: C

jobs:
  pass:
    name: ${{ inputs.lane == 'sdk' && format('SDK pass {0}', inputs.pass) || format('Pass {0}', inputs.pass) }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
    - name: Record pass start
      run: echo "PASS_START=$(date +%s)" >> "$GITHUB_ENV"

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
          /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules \
          /opt/microsoft /opt/google /usr/lib/jvm || true
        docker image prune -af >/dev/null || true
        sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile || true

    - name: Lay out build directories
      run: |
        # TMPDIR is the biggest consumer: give it /mnt and bind it at ./build
        # so the collect-*.sh scripts find it as usual.
        sudo mkdir -p /mnt/yocto-build "$DL_DIR"
        sudo chown "$(id -u):$(id -g)" /mnt/yocto-build "$DL_DIR"
        mkdir -p build "$SSTATE_DIR" "$SDK_SSTATE_DIR" ~/.ssh
        sudo mount --bind /mnt/yocto-build build
        df -h / /mnt

    - name: Determine feed configuration
      id: feed-config
      run: |
        set -euo pipefail
        REF_TYPE="branch"
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          REF_TYPE="tag"
        fi
        bash .github/scripts/load-script-output.sh -- bash .github/scripts/determine-feed-config.sh "${{ inputs.kas_file }}" "${{ github.ref_name }}" "$REF_TYPE"

    - name: Prepare build configuration
      id: prepare-config
      run: |
        set -euo pipefail
        bash .github/scripts/load-script-output.sh --env distro_version:DISTRO_VERSION -- bash .github/scripts/prepare-build-config.sh \
          "${{ inputs.kas_file }}" \
          "${{ steps.feed-config.outputs.distro_codename }}" \
          "${{ steps.feed-config.outputs.feed_subfolder }}" \
          "${{ github.ref_name }}" \
          "${{ steps.feed-config.outputs.is_tagged_release }}"

    - name: Identify Yocto release
      run: |
        # sstate never carries across Yocto releases, so each release keeps
        # its own cache entries instead of evicting the other's.
        # oe-core is poky/meta up to walnascar and a separate
        # openembedded-core checkout (split Poky) from wrynose on.
        release=
        for conf in poky/meta/conf/layer.conf openembedded-core/meta/conf/layer.conf; do
          if [ -f "$conf" ]; then
            release=$(sed -nE 's/^LAYERSERIES_CORENAMES = "([a-z]+).*/\1/p' "$conf")
            break
          fi
        done
        if [ -z "$release" ]; then
          echo "::error::Could not read LAYERSERIES_CORENAMES from poky/meta or openembedded-core/meta"
          exit 1
        fi
        echo "Yocto release: $release"
        {
          echo "SSTATE_RELEASE_PREFIX=sstate-$release-${{ inputs.machine }}-"
          echo "IMG_CACHE_PREFIX=sstate-$release-${{ inputs.machine }}-img-"
          echo "SDK_CACHE_PREFIX=sstate-$release-${{ inputs.machine }}-sdk-"
        } >> "$GITHUB_ENV"

    - name: Restore shared image sstate cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.SSTATE_DIR }}
        key: ${{ env.IMG_CACHE_PREFIX }}${{ github.run_id }}
        # The last two keys pick up entries saved before image keys carried
        # "img-" and the release (2026-09-29); drop them once those entries
        # have aged out (7 days unused).
        restore-keys: |
          ${{ env.IMG_CACHE_PREFIX }}
          ${{ env.SSTATE_RELEASE_PREFIX }}
          sstate-${{ inputs.machine }}-

    - name: Snapshot image sstate
      if: inputs.lane == 'sdk'
      run: (cd "$SSTATE_DIR" && find . -type f | sort) > "$RUNNER_TEMP/image-sstate.txt"

    - name: Restore SDK sstate cache
      if: inputs.lane == 'sdk'
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.SDK_SSTATE_DIR }}
        key: ${{ env.SDK_CACHE_PREFIX }}${{ github.run_id }}
        restore-keys: ${{ env.SDK_CACHE_PREFIX }}

    - name: Merge SDK sstate
      if: inputs.lane == 'sdk'
      run: |
        cp -aln "$SDK_SSTATE_DIR"/. "$SSTATE_DIR"/
        rm -rf "$SDK_SSTATE_DIR"

    - name: Fetch sstate from earlier passes
      if: inputs.pass > 1
      uses: actions/download-artifact@v4
      with:
        pattern: sstate-delta-${{ inputs.machine }}-${{ inputs.lane }}-*
        path: ${{ runner.temp }}/deltas

    - name: Unpack sstate deltas and snapshot the file list
      run: |
        shopt -s nullglob
        for t in "$RUNNER_TEMP"/deltas/*/*.tar; do
          echo "Unpacking $t"
          tar -xf "$t" -C "$SSTATE_DIR" && rm -f "$t"
        done
        # Zero atimes so relatime records every read this pass makes; the
        # prune and SDK selection steps key on it.
        find "$SSTATE_DIR" -type f -exec touch -a -d @0 {} +
        # Anything not in this list afterwards was produced by this pass.
        (cd "$SSTATE_DIR" && find . -type f | sort) > "$RUNNER_TEMP/sstate-before.txt"
        touch "$RUNNER_TEMP/pass-marker"
        echo "Restored $(wc -l < "$RUNNER_TEMP/sstate-before.txt") sstate files ($(du -sh "$SSTATE_DIR" | cut -f1))"

    - name: Add hosted-runner build settings
      run: |
        # Hosted runners start with an empty DL_DIR. Fetch from our own source
        # mirror first (kept current by the publish job; version-controlled
        # sources come as mirror tarballs), then the Yocto source mirror, then
        # upstream. Some upstreams (zlib.net) intermittently answer datacenter
        # IPs with 200 + a non-tarball body, and BitBake aborts on the first
        # mirror whose content fails the checksum, so upstream goes last.
        cat >> "${{ steps.prepare-config.outputs.kas_override_file }}" << 'EOF'
          ci_hosted_fetch: |
            PREMIRRORS:prepend = "\
                git://.*/.* https://opkg.calculinux.org/.sources/ \
                gitsm://.*/.* https://opkg.calculinux.org/.sources/ \
                https?://.*/.* https://opkg.calculinux.org/.sources/ \
                ftp://.*/.* https://opkg.calculinux.org/.sources/ \
                https?://.*/.* https://downloads.yoctoproject.org/mirror/sources/ \
                ftp://.*/.* https://downloads.yoctoproject.org/mirror/sources/ \
            "
          ci_hosted_persist: |
            # Hash equivalence data (hashserv.db) lives in PERSISTENT_DIR.
            # Keep it inside the sstate tree so it travels with the image
            # cache and pass deltas; without it objects stored under an
            # equivalent hash are missed on the next runner. The SDK entry
            # does not carry its own copy (two copies cannot be merged), so
            # an SDK object stored under an equivalent hash can occasionally
            # miss and rebuild.
            PERSISTENT_DIR = "${SSTATE_DIR}/persistent"
        EOF
        cat "${{ steps.prepare-config.outputs.kas_override_file }}"

    - name: Build (time-boxed)
      id: build
      run: |
        bash .github/scripts/yocto-pass.sh \
          "${{ steps.prepare-config.outputs.kas_override_file }}" \
          "$(( PASS_START + BUILD_BUDGET_MIN * 60 ))" \
          "${{ inputs.lane }}"

    - name: Package sstate delta for the next pass
      if: steps.build.outputs.done == 'false'
      run: |
        (cd "$SSTATE_DIR" && find . -type f | sort) > "$RUNNER_TEMP/sstate-after.txt"
        # New objects, plus the persistent dir (hashserv.db is updated in place).
        { comm -13 "$RUNNER_TEMP/sstate-before.txt" "$RUNNER_TEMP/sstate-after.txt"
          (cd "$SSTATE_DIR" && find ./persistent -type f 2>/dev/null); } | sort -u > "$RUNNER_TEMP/sstate-new.txt"
        mkdir -p "$RUNNER_TEMP/delta-out"
        # sstate objects are already zstd-compressed; plain tar.
        tar -cf "$RUNNER_TEMP/delta-out/pass${{ inputs.pass }}.tar" -C "$SSTATE_DIR" -T "$RUNNER_TEMP/sstate-new.txt"
        echo "Delta: $(wc -l < "$RUNNER_TEMP/sstate-new.txt") files, $(du -h "$RUNNER_TEMP/delta-out/pass${{ inputs.pass }}.tar" | cut -f1)"

    - name: Upload sstate delta
      if: steps.build.outputs.done == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: sstate-delta-${{ inputs.machine }}-${{ inputs.lane }}-pass${{ inputs.pass }}
        path: ${{ runner.temp }}/delta-out/
        compression-level: 0
        retention-days: 1

    - name: List packages built by this run
      if: inputs.lane == 'image' && steps.build.outputs.done == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -q .run_started_at)
        echo "Run started $started"
        build_tmp=$(bash .github/scripts/build-dir.sh)
        bash .github/scripts/list-new-packages.sh "$build_tmp/deploy/ipk" \
          "$(date -d "$started" +%s)" "$RUNNER_TEMP/packages-new.txt"

    - name: Collect build outputs
      if: inputs.lane == 'image' && steps.build.outputs.done == 'true'
      run: |
        OUT="$RUNNER_TEMP/build-output"
        mkdir -p "$OUT"
        bash .github/scripts/collect-images.sh "${{ inputs.machine }}" "$OUT"
        if [ "${{ github.event_name }}" = pull_request ]; then
          # PRs publish only what they built to the testing feed.
          build_tmp=$(bash .github/scripts/build-dir.sh)
          while IFS= read -r ipk; do
            mkdir -p "$OUT/packages/$(dirname "$ipk")"
            cp "$build_tmp/deploy/ipk/$ipk" "$OUT/packages/$ipk"
          done < "$RUNNER_TEMP/packages-new.txt"
        else
          bash .github/scripts/collect-packages.sh "$OUT"
        fi
        cp "$RUNNER_TEMP/packages-new.txt" "$OUT/"
        cat > "$OUT/workflow-metadata.env" << EOF
        FEED_NAME=${{ steps.feed-config.outputs.feed_name }}
        SUBFOLDER=${{ steps.feed-config.outputs.subfolder }}
        FEED_SUBFOLDER=${{ steps.feed-config.outputs.feed_subfolder }}
        DISTRO_CODENAME=${{ steps.feed-config.outputs.distro_codename }}
        IS_PUBLISHED_BRANCH=${{ steps.feed-config.outputs.is_published_branch }}
        IS_TAGGED_RELEASE=${{ steps.feed-config.outputs.is_tagged_release }}
        IS_PRERELEASE=${{ steps.feed-config.outputs.is_prerelease }}
        DISTRO_VERSION=${{ steps.prepare-config.outputs.distro_version }}
        EOF
        du -sh "$OUT"/*

    - name: Upload build outputs
      if: inputs.lane == 'image' && steps.build.outputs.done == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event_name == 'pull_request' && 'pr-output' || 'build-output' }}-${{ inputs.machine }}
        path: ${{ runner.temp }}/build-output/
        compression-level: 0
        retention-days: ${{ github.event_name == 'pull_request' && 14 || 7 }}

    - name: Collect SDK
      if: inputs.lane == 'sdk' && steps.build.outputs.done == 'true'
      run: |
        mkdir -p "$RUNNER_TEMP/build-output"
        bash .github/scripts/collect-sdk.sh "$RUNNER_TEMP/build-output"

    - name: Upload SDK
      if: inputs.lane == 'sdk' && steps.build.outputs.done == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: sdk-${{ inputs.machine }}
        path: ${{ runner.temp }}/build-output/
        compression-level: 0
        retention-days: 7

    # --- Image lane: save the pruned working set, keep the two newest ---

    - name: Prune sstate to this build's working set
      if: inputs.lane == 'image' && steps.build.outputs.done == 'true' && env.SAVE_CACHE == 'true'
      run: bash .github/scripts/prune-sstate.sh "$SSTATE_DIR" "$RUNNER_TEMP/pass-marker" "$SSTATE_CACHE_BUDGET_MIB"

    - name: Save shared image sstate cache
      if: inputs.lane == 'image' && steps.build.outputs.done == 'true' && env.SAVE_CACHE == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.SSTATE_DIR }}
        key: ${{ env.IMG_CACHE_PREFIX }}${{ github.run_id }}

    - name: Keep the two newest image sstate caches
      if: inputs.lane == 'image' && steps.build.outputs.done == 'true' && env.SAVE_CACHE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        bash .github/scripts/rotate-caches.sh "$IMG_CACHE_PREFIX" \
          "${IMG_CACHE_PREFIX}${{ github.run_id }}" 2

    # --- SDK lane: save only what the image entry lacks, keep the newest ---

    - name: Stage SDK sstate
      if: inputs.lane == 'sdk' && steps.build.outputs.done == 'true' && env.SAVE_CACHE == 'true'
      run: |
        bash .github/scripts/select-sdk-sstate.sh "$SSTATE_DIR" "$RUNNER_TEMP/image-sstate.txt" \
          "$RUNNER_TEMP/pass-marker" "$SDK_SSTATE_DIR"
        size=$(du -sm "$SDK_SSTATE_DIR" | cut -f1)
        if [ "$size" -gt "$SDK_CACHE_BUDGET_MIB" ]; then
          echo "::warning::SDK sstate (${size} MiB) exceeds its budget (${SDK_CACHE_BUDGET_MIB} MiB)"
        fi

    - name: Save SDK sstate cache
      if: inputs.lane == 'sdk' && steps.build.outputs.done == 'true' && env.SAVE_CACHE == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.SDK_SSTATE_DIR }}
        key: ${{ env.SDK_CACHE_PREFIX }}${{ github.run_id }}

    - name: Keep the newest SDK sstate cache
      if: inputs.lane == 'sdk' && steps.build.outputs.done == 'true' && env.SAVE_CACHE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        bash .github/scripts/rotate-caches.sh "$SDK_CACHE_PREFIX" \
          "${SDK_CACHE_PREFIX}${{ github.run_id }}" 1

    - name: Disk usage
      if: always()
      run: |
        df -h / /mnt
        du -sh "$SSTATE_DIR" "$DL_DIR" build/tmp 2>/dev/null || true
