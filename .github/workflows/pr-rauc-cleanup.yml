name: Cleanup PR RAUC Bundles

on:
  pull_request:
    branches: [ main ]
    types: [closed]
  workflow_dispatch:

env:
  OPKG_REPO_DIR: /mnt/opkg-repo
  UPDATE_BASE_URL: https://opkg.calculinux.org

permissions:
  contents: read
  pull-requests: read

jobs:
  sweep:
    name: Keep only open-PR artifacts
    runs-on: [self-hosted, Linux, X64]
    strategy:
      matrix:
        machine: [luckfox-lyra]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Remove closed-PR RAUC/WIC artifacts and refresh indexes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        bash .github/scripts/sweep-stale-pr-artifacts.sh \
          "${{ matrix.machine }}" \
          "$OPKG_REPO_DIR" \
          "$UPDATE_BASE_URL" \
          "${{ github.repository }}"
