name: QEMU Boot Test and Emulator

# Builds calculinux-qemuarm and boots it end to end:
# U-Boot -> boot.scr (RAUC A/B) -> merged DT-overlay FIT -> preinit/overlayfs,
# then rebuilds the per-slot FIT on /data and checks U-Boot boots it.
# Runs the overlayfs upper-layer ioctl test (qemu-overlay-test.py).
# Also builds the calculinux-emulator AppImages (x86_64 and aarch64 hosts),
# boot-tests the x86_64 one, and publishes them next to the SDKs.
#
# Builds and tests run on GitHub-hosted runners as time-boxed pass chains
# (yocto-pass.yml, see build-hosted.yml); a warm build finishes in the first
# pass of each lane. Only publishing needs the self-hosted runner.
#
#   pass1..3  calculinux-qemuarm image; runqemu boot and overlay tests
#   emu1..3   emulator AppImages and their disk image; x86_64 AppImage test
#   publish   self-hosted: publish the emulator (published refs only)

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # read the run's start time, delete superseded cache entries

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pass1:
    uses: ./.github/workflows/yocto-pass.yml
    with:
      pass: 1
      machine: calculinux-qemuarm
      kas_file: kas-calculinux-qemuarm.yaml
      collect: false
      # The emulator lane builds on this sstate even when nothing is cached.
      handoff: true
      post_build: .github/scripts/qemu-image-tests.sh
      post_build_minutes: 45

  pass2:
    needs: pass1
    if: needs.pass1.outputs.done == 'false'
    uses: ./.github/workflows/yocto-pass.yml
    with:
      pass: 2
      machine: calculinux-qemuarm
      kas_file: kas-calculinux-qemuarm.yaml
      collect: false
      handoff: true
      post_build: .github/scripts/qemu-image-tests.sh
      post_build_minutes: 45

  pass3:
    needs: pass2
    if: needs.pass2.outputs.done == 'false'
    uses: ./.github/workflows/yocto-pass.yml
    with:
      pass: 3
      machine: calculinux-qemuarm
      kas_file: kas-calculinux-qemuarm.yaml
      collect: false
      handoff: true
      post_build: .github/scripts/qemu-image-tests.sh
      post_build_minutes: 45

  # Needs the image lane to have finished and passed its tests.
  emu1:
    needs: [pass1, pass2, pass3]
    if: >-
      always() && !cancelled() &&
      ((needs.pass1.outputs.done == 'true' && needs.pass1.result == 'success') ||
       (needs.pass2.outputs.done == 'true' && needs.pass2.result == 'success') ||
       (needs.pass3.outputs.done == 'true' && needs.pass3.result == 'success'))
    uses: ./.github/workflows/yocto-pass.yml
    with:
      pass: 1
      lane: emulator
      machine: calculinux-qemuarm
      kas_file: kas-calculinux-qemuarm.yaml
      post_build: .github/scripts/qemu-appimage-test.sh
      post_build_minutes: 30

  emu2:
    needs: emu1
    if: needs.emu1.outputs.done == 'false'
    uses: ./.github/workflows/yocto-pass.yml
    with:
      pass: 2
      lane: emulator
      machine: calculinux-qemuarm
      kas_file: kas-calculinux-qemuarm.yaml
      post_build: .github/scripts/qemu-appimage-test.sh
      post_build_minutes: 30

  emu3:
    needs: emu2
    if: needs.emu2.outputs.done == 'false'
    uses: ./.github/workflows/yocto-pass.yml
    with:
      pass: 3
      lane: emulator
      machine: calculinux-qemuarm
      kas_file: kas-calculinux-qemuarm.yaml
      post_build: .github/scripts/qemu-appimage-test.sh
      post_build_minutes: 30

  # Hosted runners cannot reach the opkg server; publish from a self-hosted
  # runner, pushes to published refs only, once the AppImage test passed.
  publish:
    name: Publish emulator
    needs: [emu1, emu2, emu3]
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' &&
      (github.ref_name == 'main' || github.ref_name == 'develop' || startsWith(github.ref, 'refs/tags/')) &&
      ((needs.emu1.outputs.done == 'true' && needs.emu1.result == 'success') ||
       (needs.emu2.outputs.done == 'true' && needs.emu2.result == 'success') ||
       (needs.emu3.outputs.done == 'true' && needs.emu3.result == 'success'))
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write   # attach emulator AppImages to tagged releases
    env:
      OPKG_REPO_DIR: /mnt/opkg-repo
      MACHINE: calculinux-qemuarm
      KAS_FILE: kas-calculinux-qemuarm.yaml
      ARTIFACTS_DIR: /mnt/opkg-repo/.build-artifacts/emulator-${{ github.run_id }}
      DL_DIR: /mnt/runner-cache/yocto-cache/downloads
      SSTATE_DIR: /mnt/runner-cache/yocto-cache/sstate-cache
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch emulator
      uses: actions/download-artifact@v4
      with:
        name: emulator-${{ env.MACHINE }}
        path: ${{ env.ARTIFACTS_DIR }}

    - name: Determine feed configuration
      id: feed-config
      run: |
        set -euo pipefail
        REF_TYPE="branch"
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          REF_TYPE="tag"
        fi
        bash .github/scripts/load-script-output.sh -- bash .github/scripts/determine-feed-config.sh "$KAS_FILE" "${{ github.ref_name }}" "$REF_TYPE"

    - name: Publish emulator next to the SDKs
      if: steps.feed-config.outputs.is_published_branch == 'true'
      run: |
        bash .github/scripts/publish-emulator.sh \
          "$OPKG_REPO_DIR" \
          "${{ steps.feed-config.outputs.feed_name }}" \
          "${{ steps.feed-config.outputs.subfolder }}" \
          "$MACHINE" \
          "$ARTIFACTS_DIR" \
          "${{ steps.feed-config.outputs.is_tagged_release }}" \
          "${{ steps.feed-config.outputs.is_prerelease }}" \
          "${{ github.ref_name }}"

    - name: Attach emulator to release
      if: steps.feed-config.outputs.is_tagged_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.ARTIFACTS_DIR }}/emulator/x86_64/*
          ${{ env.ARTIFACTS_DIR }}/emulator/aarch64/*
          ${{ env.ARTIFACTS_DIR }}/emulator/image/*
        prerelease: ${{ steps.feed-config.outputs.is_prerelease == 'true' }}

    - name: Clean up
      if: always()
      run: rm -rf "$ARTIFACTS_DIR"
